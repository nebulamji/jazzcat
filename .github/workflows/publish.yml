# Publish to npm from a version tag (v*) with npm trusted publishing (OIDC): no token stored anywhere.
# One-time: on npmjs.com, package settings → Trusted publishing → GitHub Actions, repo nebulamji/jazzcat, workflow publish.yml.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node bin/jazzcat.mjs url
      - run: npm publish --access public --provenance
